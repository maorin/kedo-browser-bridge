<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kedo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
      }
      h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
      .status { padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
      .status.ok { background: #1e7e34; color: white; }
      .status.pending { background: #f0ad4e; color: #5a3e00; }
      .status.error { background: #c82333; color: white; }
      label { display: block; margin: 6px 0; }
      input, textarea, button {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 6px 8px;
        border: 1px solid #888;
        border-radius: 4px;
        background: transparent;
        color: inherit;
      }
      textarea { min-height: 50px; resize: vertical; }
      button { cursor: pointer; background: #2962ff; color: white; border-color: #2962ff; margin-top: 6px; }
      button.secondary { background: transparent; color: inherit; border-color: #888; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>kedo Browser Bridge</h1>
    <div id="status" class="status pending">Loading…</div>

    <section id="config" hidden>
      <label>Backend URL
        <input id="wsUrl" placeholder="ws://localhost:8000/api/ws/browser" />
      </label>
      <label>Token
        <input id="token" type="password" placeholder="from ~/.config/kedo/browser_token" />
      </label>
      <button id="saveCfg">Save</button>
    </section>

    <section id="main" hidden>
      <label>Note (optional)
        <textarea id="note" placeholder="Why is this useful for the agent?"></textarea>
      </label>
      <button id="send">Send to kedo</button>
      <button id="reconfig" class="secondary">Reconfigure</button>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
